[project]
name = "corerag"
version = "0.1.0"
description = "SOTA agentic RAG engine over AI Systems literature: two-stage retrieval (hybrid + cross-encoder rerank) with a LangGraph reflection loop."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "structlog>=24.1",
    "qdrant-client>=1.10",
    "redis>=5.0",
    "redisvl>=0.3",
    "arxiv>=2.1",
    "pymupdf>=1.24",
    "fastembed>=0.4",
    "tiktoken>=0.7",
    "sentence-transformers[onnx]>=3.3",
    # Direct (not left transitive via sentence-transformers): [tool.uv.sources]'s
    # per-platform index override below only took effect once torch was pinned
    # as a real project dependency, not left implicit -- confirmed live.
    "torch>=2.0",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-groq>=0.2",
    "langfuse>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "python-dotenv>=1.0",
]
eval = [
    "ragas==0.3.9",
    "rapidfuzz>=3.14.5",
]

# This is an application, not a distributable library: uv manages the venv and
# dependencies but does not build/install the project itself.
[tool.uv]
package = false

# CPU-only torch: reranker_mode is always CPU (pytorch-cpu/cpu-onnx, see
# core/config.py) -- never GPU -- but PyPI's default `torch` wheel on Linux
# bundles the full CUDA toolkit regardless (nvidia-cublas/cudnn/cufft/etc.),
# confirmed live: it blew a first production Docker build up to 22.9GB.
# sys_platform=='linux' only (not the inverse on Darwin): this dev machine's
# macOS torch wheels never bundle CUDA anyway, so it keeps resolving from the
# default index there -- the pytorch-cpu index only changes the Linux (deploy
# target) resolution. Matches uv's own documented pattern exactly (verified
# live via docs.astral.sh/uv/guides/integration/pytorch), not guessed syntax.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["arxiv.*", "fastembed.*", "tokenizers.*", "redisvl.*", "ragas.*"]
ignore_missing_imports = true

# PyMuPDF ships partial type hints that trip strict mode; treat it as untyped.
[[tool.mypy.overrides]]
module = ["pymupdf.*"]
follow_imports = "skip"
ignore_missing_imports = true

# StateGraph.add_node's generic overloads fail to resolve against a node function
# passed through any typed indirection (a Callable-typed variable, a factory
# function's return value) -- confirmed via isolated repro to be a mypy/langgraph
# overload-resolution limitation, not a real error (the runtime behavior, and
# LangGraph's own documented builder-function pattern, are both correct).
[[tool.mypy.overrides]]
module = ["langgraph.*"]
follow_imports = "skip"
ignore_missing_imports = true

# CrossEncoder.predict()'s multimodal (text/image/audio/video) signature doesn't
# type-check cleanly against simple (str, str) pairs; treat it as untyped.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not integration'"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: requires running services (qdrant/redis/grobid/langfuse) or slow/heavy resources (e.g. loading an ML model)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
